<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin{% endblock %} · Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="/admin/">~/admin<span class="cursor">_</span></a>
    {% block nav %}
    <nav>
      <a href="/admin/">projetos</a>
      <a href="/admin/freelance">freelance</a>
      <a href="/admin/resume">currículo</a>
      <a href="/admin/photo">foto</a>
      <a href="/admin/settings">site</a>
      <a href="/" target="_blank" rel="noopener">ver site ↗</a>
      <form method="post" action="/admin/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <button type="submit" class="link-btn">sair</button>
      </form>
    </nav>
    {% endblock %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
