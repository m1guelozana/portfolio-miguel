<div class="exp-row">
  <input type="text" name="svc_title" value="{{ svc_title }}" placeholder="Serviço (ex.: Automação de processos com Python)">
  <textarea name="svc_description" rows="3" placeholder="O que você entrega e que problema resolve">{{ svc_description }}</textarea>
  <input type="text" name="svc_tags" value="{{ svc_tags }}" placeholder="Tags separadas por vírgula (ex.: Python, Selenium, APIs)">
  <button type="button" class="btn ghost sm" onclick="this.parentElement.remove()">remover</button>
</div>
