<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Miguel Ozana{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="./home/miguelodcs/Projetos/python/meu-projeto/portfolio-miguel/app/files/foto.jpg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">~/miguel<span class="cursor">_</span></a>
    <nav>
      <a href="/#projetos">projetos</a>
      {% if site and site.freelance_enabled %}<a href="/#freelance">freelance</a>{% endif %}
      <a href="/#stack">stack</a>
      <a href="/#experiencia">experiência</a>
      <a href="/#contato">contato</a>
      {% if has_resume() %}<a class="nav-resume" href="/curriculo">currículo ↓</a>{% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>© {{ site.name if site else "Miguel Ozana" }}</span>
  </footer>
</body>
</html>
